name: NBA Enrichment

# Rosters, draft classes and player bios publish on their own schedules, not
# with the box-score files the refresh probe watches, so player profiles, team
# ratings and game projections also rebuild here twice a day in season and once
# a day off season. Writes only the enrichment tables.
on:
  schedule:
    - cron: "41 8,20 * 10-12,1-6 *"
    - cron: "41 9 * 7-9 *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: nba-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build player profiles and team ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          BASKETBALL_SUPABASE_HOST: ${{ vars.BASKETBALL_SUPABASE_HOST }}
        run: python backend/ingest_enrichment.py
