name: Nightly NBA Refresh

on:
  schedule:
    # GitHub schedule dispatch is best effort.  The primary cadence is the
    # self-booked refresh-timer chain, and backend/refresh_schedule.py turns most
    # firings into a no-op: it reads tip-off times from the games table and only
    # lets the source probe run every 30 minutes from 3h to 8h after a tip-off,
    # hourly to +30h, while a final score is still missing its stats, and every
    # 6 hours otherwise in season (October through June).  The crons below are a
    # backup that restarts a broken chain: every 30 minutes in season, daily in
    # the July-September offseason.  Odd minutes avoid GitHub's top-of-hour
    # scheduling backlog.
    - cron: "7,37 * * 10-12,1-6 *"
    - cron: "13 10 * 7-9 *"
  workflow_dispatch:
    inputs:
      planned:
        description: "Started by the refresh timer; let the planner decide instead of forcing"
        type: boolean
        default: false
      force:
        description: "Run a full current-season refresh even when source metadata is unchanged"
        type: boolean
        default: false
      full_game_log_reingest:
        description: "Compatibility alias for a full current-season refresh"
        type: boolean
        default: false
      backfill_seasons:
        description: "Re-ingest a season range as well, e.g. 2011-2026 (needed after adding a metric source)"
        type: string
        default: ""
      rollup_all_time:
        description: "Rebuild the All Time career rollup (season 0)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pins the Basketball Supabase project host so a stray secret can never point
  # this workflow at another app's database (the Football project is refused by
  # name regardless).
  BASKETBALL_SUPABASE_HOST: ${{ vars.BASKETBALL_SUPABASE_HOST }}
  # STATCAST_SEASON is passed through empty unless the repo variable is set.
  # Empty keeps the calendar resolver: hoopR names a season for the year it
  # ends, so year + 1 if month >= 10, otherwise year (October 2026 is 2027).

concurrency:
  group: nba-data-refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      season: ${{ steps.source-probe.outputs.season }}
      ready: ${{ steps.source-probe.outputs.ready }}
      changed: ${{ steps.source-probe.outputs.changed }}
      refresh_id: ${{ steps.source-probe.outputs.refresh_id }}
      fingerprint: ${{ steps.source-probe.outputs.fingerprint }}
      wait_seconds: ${{ steps.plan.outputs.wait_seconds }}
      source_published_at: ${{ steps.source-probe.outputs.source_published_at }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The planner is stdlib except for reading hoopR's schedule parquet, which
      # needs pyarrow, so a skipped firing costs a checkout, one small wheel and
      # a few small requests.  It also keeps the games table (schedule and
      # final scores) in sync for the app's Games tab.
      - name: Plan from the NBA schedule
        id: plan
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && !inputs.planned }}
        run: |
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python -m pip install --quiet pyarrow
          python backend/refresh_schedule.py --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Probe hoopR source generations
        if: steps.plan.outputs.probe == 'true'
        id: source-probe
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          FORCE_REFRESH: ${{ inputs.force || inputs.full_game_log_reingest || inputs.backfill_seasons != '' || inputs.rollup_all_time }}
        run: |
          set -o pipefail
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python backend/source_probe.py --github-output "$GITHUB_OUTPUT" "${args[@]}" 2>&1 | tee source_probe.log

  refresh:
    if: needs.probe.outputs.changed == 'true'
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Full current-season rebuilds are source-complete and still small.  Keep
    # room for an explicit historical backfill or career rollup below.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      - name: Build and atomically publish current season
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          REFRESH_ID: ${{ needs.probe.outputs.refresh_id }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/refresh.py --refresh-id "$REFRESH_ID" --season "$SEASON" 2>&1 | tee refresh.log

      # Advanced game pages from box scores and play-by-play. Runs after the atomic publish
      # (or its unchanged no-op) so a pbp-only upload still refreshes games.
      - name: Build advanced game details
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/ingest_game_details.py --season "$SEASON" 2>&1 | tee game_details.log

      # Player bio, team power ratings and game projections. New tables only,
      # so a failure here never touches the published snapshots; the daily
      # enrichment workflow retries it.
      - name: Build player profiles and team ratings
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/ingest_enrichment.py --season "$SEASON" 2>&1 | tee enrichment.log

      # Adding a metric source only reaches seasons explicitly requested.  The
      # event path above remains current-season only and does not rewrite the
      # historical bundle or career rollup on every probe.
      - name: Backfill season range
        if: inputs.backfill_seasons != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RANGE: ${{ inputs.backfill_seasons }}
        run: |
          set -o pipefail
          FIRST="${RANGE%%-*}"
          LAST="${RANGE##*-}"
          if ! [[ "$FIRST" =~ ^[0-9]{4}$ && "$LAST" =~ ^[0-9]{4}$ ]]; then
            echo "backfill_seasons must look like 2011-2026 (got '$RANGE')" >&2
            exit 1
          fi
          if [ "$FIRST" -gt "$LAST" ]; then
            echo "backfill_seasons range is inverted: $RANGE" >&2
            exit 1
          fi
          for season in $(seq "$FIRST" "$LAST"); do
            echo "::group::Backfilling $season"
            python backend/ingest.py --season "$season" --season-type all 2>&1 | tee -a backfill.log
            echo "::endgroup::"
          done

      - name: Rebuild All Time career rollup
        if: inputs.rollup_all_time
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/rollup_all_time.py --season-type all 2>&1 | tee all_time.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            backend/tests/
            backend/*.py
            source_probe.log
            refresh.log
            backfill.log
            all_time.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'NBA data refresh failed',
              body: ':warning: NBA data refresh failed, check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })

  # Book the next check. Runs whether or not this run probed or refreshed, so
  # the chain survives a failed build; the backup cron restarts a broken chain.
  schedule-next:
    needs: [probe, refresh]
    if: always() && needs.probe.outputs.wait_seconds != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the refresh timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT: ${{ needs.probe.outputs.wait_seconds }}
        run: gh workflow run refresh-timer.yml --repo "$GITHUB_REPOSITORY" -f wait_seconds="$WAIT"
